services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DEVICE_DATABASE_NAME:-device_ai_agent}
      POSTGRES_USER: ${DEVICE_DATABASE_USER:-device}
      POSTGRES_PASSWORD: ${DEVICE_DATABASE_PASSWORD:?Set DEVICE_DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:${DEVICE_DATABASE_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DEVICE_DATABASE_USER:-device} -d ${DEVICE_DATABASE_NAME:-device_ai_agent}"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  control-api:
    build: ./services/control_api
    environment:
      DEVICE_DATABASE_URL: postgresql+psycopg://${DEVICE_DATABASE_USER:-device}:${DEVICE_DATABASE_PASSWORD:?Set DEVICE_DATABASE_PASSWORD}@db:5432/${DEVICE_DATABASE_NAME:-device_ai_agent}
      DEVICE_REDIS_URL: redis://redis:6379/0
      DEVICE_DOCUMENT_STORAGE_ROOT: /data/documents
      DEVICE_DOCUMENT_LLM_BASE_URL: ${DEVICE_DOCUMENT_LLM_BASE_URL:-https://api.openai.com/v1}
      DEVICE_DOCUMENT_LLM_API_KEY: ${DEVICE_DOCUMENT_LLM_API_KEY:-}
      DEVICE_DOCUMENT_LLM_MODEL: ${DEVICE_DOCUMENT_LLM_MODEL:-}
      DEVICE_DOCUMENT_VISION_BASE_URL: ${DEVICE_DOCUMENT_VISION_BASE_URL:-https://api.openai.com/v1}
      DEVICE_DOCUMENT_VISION_API_KEY: ${DEVICE_DOCUMENT_VISION_API_KEY:-}
      DEVICE_DOCUMENT_VISION_MODEL: ${DEVICE_DOCUMENT_VISION_MODEL:-}
      DEVICE_DOCUMENT_EMBEDDING_BASE_URL: ${DEVICE_DOCUMENT_EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      DEVICE_DOCUMENT_EMBEDDING_API_KEY: ${DEVICE_DOCUMENT_EMBEDDING_API_KEY:-}
      DEVICE_DOCUMENT_EMBEDDING_MODEL: ${DEVICE_DOCUMENT_EMBEDDING_MODEL:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DEVICE_API_PORT:-8000}:8000"
    volumes:
      - document-files:/data/documents

  document-worker:
    build: ./services/control_api
    command: celery -A app.modules.document.celery_app:celery_app worker --loglevel=INFO
    environment:
      DEVICE_DATABASE_URL: postgresql+psycopg://${DEVICE_DATABASE_USER:-device}:${DEVICE_DATABASE_PASSWORD:?Set DEVICE_DATABASE_PASSWORD}@db:5432/${DEVICE_DATABASE_NAME:-device_ai_agent}
      DEVICE_REDIS_URL: redis://redis:6379/0
      DEVICE_DOCUMENT_STORAGE_ROOT: /data/documents
      DEVICE_DOCUMENT_LLM_BASE_URL: ${DEVICE_DOCUMENT_LLM_BASE_URL:-https://api.openai.com/v1}
      DEVICE_DOCUMENT_LLM_API_KEY: ${DEVICE_DOCUMENT_LLM_API_KEY:-}
      DEVICE_DOCUMENT_LLM_MODEL: ${DEVICE_DOCUMENT_LLM_MODEL:-}
      DEVICE_DOCUMENT_VISION_BASE_URL: ${DEVICE_DOCUMENT_VISION_BASE_URL:-https://api.openai.com/v1}
      DEVICE_DOCUMENT_VISION_API_KEY: ${DEVICE_DOCUMENT_VISION_API_KEY:-}
      DEVICE_DOCUMENT_VISION_MODEL: ${DEVICE_DOCUMENT_VISION_MODEL:-}
      DEVICE_DOCUMENT_EMBEDDING_BASE_URL: ${DEVICE_DOCUMENT_EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      DEVICE_DOCUMENT_EMBEDDING_API_KEY: ${DEVICE_DOCUMENT_EMBEDDING_API_KEY:-}
      DEVICE_DOCUMENT_EMBEDDING_MODEL: ${DEVICE_DOCUMENT_EMBEDDING_MODEL:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - document-files:/data/documents

volumes:
  document-files:
