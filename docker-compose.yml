services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: device_ai_agent
      POSTGRES_USER: device
      POSTGRES_PASSWORD: device
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U device -d device_ai_agent"]
      interval: 2s
      timeout: 3s
      retries: 20

  control-api:
    build: ./services/control_api
    environment:
      DEVICE_DATABASE_URL: postgresql+psycopg://device:device@db:5432/device_ai_agent
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
