<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
<style>
:root{--bg:#ffffff;--band:#f6f8fa;--band2:#ffffff;--fg:#1f2328;--muted:#59636e;--line:#59636e;--box:#ffffff;--stroke:#d1d9e0;--acc:#0969da;--accbg:#ddf4ff;--chip:#f6f8fa}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--band:#151b23;--band2:#0d1117;--fg:#f0f6fc;--muted:#9198a1;--line:#9198a1;--box:#0d1117;--stroke:#3d444d;--acc:#4493f8;--accbg:#121d2f;--chip:#151b23}}
.bg{fill:var(--bg)} .band{fill:var(--band)} .band2{fill:var(--band2)}
.bl{fill:var(--muted);font-size:13px;font-weight:600}
.box{fill:var(--box);stroke:var(--stroke);stroke-width:1.2}
.key{fill:var(--accbg);stroke:var(--acc);stroke-width:1.4}
.ext{fill:var(--box);stroke:var(--muted);stroke-width:1.2;stroke-dasharray:5 4}
.grp{fill:none;stroke:var(--stroke);stroke-width:1.2}
.chip{fill:var(--chip);stroke:var(--stroke);stroke-width:1}
.t{fill:var(--fg);font-size:14px;font-weight:600}
.s{fill:var(--muted);font-size:11.5px}
.c{fill:var(--fg);font-size:12px}
.lab{fill:var(--muted);font-size:11.5px}
.ln{stroke:var(--line);stroke-width:1.4;fill:none;marker-end:url(#a)}
.ln2{stroke:var(--line);stroke-width:1.4;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/></marker></defs>
