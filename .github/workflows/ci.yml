name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-api:
    name: Lint, migrations and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/control_api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: device_ai_agent_test
          POSTGRES_USER: device
          POSTGRES_PASSWORD: device
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U device -d device_ai_agent_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      # The test suite refuses to truncate any database not named *_test.
      DEVICE_DATABASE_URL: postgresql+psycopg://device:device@localhost:5432/device_ai_agent_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/control_api/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Migrations apply cleanly
        run: alembic upgrade head

      - name: Models match migrations
        run: alembic check

      - name: Tests
        run: pytest -v

  deploy-config:
    name: Compose and gateway config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Compose file resolves with the example settings
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose --profile local-idp config --quiet

      - name: Caddyfile is valid and formatted
        run: |
          docker run --rm -v "$PWD/deploy/gateway/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine sh -c \
            "caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile && caddy fmt --diff /etc/caddy/Caddyfile"

      - name: Keycloak realm is valid JSON
        run: python3 -m json.tool deploy/keycloak/device-realm.json > /dev/null
