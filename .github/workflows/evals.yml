name: Evals

# Live-model evaluation. Runs only on demand because it calls paid model APIs.
# Configure the API keys as repository secrets and the model names and base
# URLs as repository variables (Settings > Secrets and variables > Actions).
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Which suite to run
        type: choice
        options: [all, diagnosis, extraction, retrieval]
        default: all
      trials:
        description: Trials per diagnosis case / extraction document
        type: string
        default: "3"

permissions:
  contents: read

jobs:
  evals:
    name: Live-model evals
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: services/control_api
    env:
      DEVICE_DIAGNOSIS_LLM_BASE_URL: ${{ vars.DEVICE_DIAGNOSIS_LLM_BASE_URL || 'https://api.openai.com/v1' }}
      DEVICE_DIAGNOSIS_LLM_MODEL: ${{ vars.DEVICE_DIAGNOSIS_LLM_MODEL }}
      DEVICE_DIAGNOSIS_LLM_API_KEY: ${{ secrets.DEVICE_DIAGNOSIS_LLM_API_KEY }}
      DEVICE_DOCUMENT_LLM_BASE_URL: ${{ vars.DEVICE_DOCUMENT_LLM_BASE_URL || 'https://api.openai.com/v1' }}
      DEVICE_DOCUMENT_LLM_MODEL: ${{ vars.DEVICE_DOCUMENT_LLM_MODEL }}
      DEVICE_DOCUMENT_LLM_API_KEY: ${{ secrets.DEVICE_DOCUMENT_LLM_API_KEY }}
      DEVICE_DOCUMENT_EMBEDDING_BASE_URL: ${{ vars.DEVICE_DOCUMENT_EMBEDDING_BASE_URL || 'https://api.openai.com/v1' }}
      DEVICE_DOCUMENT_EMBEDDING_MODEL: ${{ vars.DEVICE_DOCUMENT_EMBEDDING_MODEL }}
      DEVICE_DOCUMENT_EMBEDDING_API_KEY: ${{ secrets.DEVICE_DOCUMENT_EMBEDDING_API_KEY }}
      SUITE: ${{ inputs.suite }}
      TRIALS: ${{ inputs.trials }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/control_api/pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Diagnosis agent
        id: diagnosis
        if: inputs.suite == 'all' || inputs.suite == 'diagnosis'
        continue-on-error: true
        run: python scripts/run_diagnosis_evals.py --trials "$TRIALS"

      - name: Extraction and retrieval
        id: document
        if: inputs.suite != 'diagnosis'
        continue-on-error: true
        run: |
          if [ "$SUITE" = "all" ]; then
            python scripts/run_document_evals.py --trials "$TRIALS"
          else
            python scripts/run_document_evals.py --suite "$SUITE" --trials "$TRIALS"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: services/control_api/runs/evals/
          if-no-files-found: warn

      - name: Gates
        if: steps.diagnosis.outcome == 'failure' || steps.document.outcome == 'failure'
        run: |
          echo "One or more evaluation gates failed; see the step logs and eval-reports artifact."
          exit 1
