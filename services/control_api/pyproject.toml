[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "device-ai-agent-control-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "alembic>=1.16,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "jsonschema>=4.25,<5",
  "celery[redis]>=5.5,<6",
  "redis>=6,<7",
  "pgvector>=0.4,<1",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "pypdf>=6,<7",
  "pypdfium2>=4.30,<5",
  "defusedxml>=0.7,<1",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff.lint]

# B008: FastAPI's `Depends(...)` in argument defaults is the intended idiom.
extend-ignore = ["B008"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]
