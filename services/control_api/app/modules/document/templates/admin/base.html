<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}设备文档审核{% endblock %}</title>
  <style>
    :root { color-scheme: light; --ink:#172033; --muted:#64748b; --line:#dbe3ee; --brand:#2563eb; --bg:#f6f8fb; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
    header { display:flex; align-items:center; justify-content:space-between; padding:16px 24px; background:#fff; border-bottom:1px solid var(--line); }
    header a { color:var(--ink); text-decoration:none; font-size:18px; font-weight:700; }
    main { max-width:1440px; margin:0 auto; padding:24px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:18px; box-shadow:0 2px 8px rgba(15,23,42,.04); }
    .toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .grid { display:grid; grid-template-columns:minmax(360px,1fr) minmax(440px,1fr); gap:18px; }
    table { width:100%; border-collapse:collapse; }
    th,td { text-align:left; padding:11px 9px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { color:var(--muted); font-weight:600; }
    a { color:var(--brand); }
    button,.button { border:0; border-radius:8px; background:var(--brand); color:#fff; padding:9px 14px; cursor:pointer; text-decoration:none; display:inline-block; }
    button.secondary,.button.secondary { background:#475569; }
    button.danger { background:#b91c1c; }
    input[type=file],input[type=text],input[type=number],select,textarea { width:100%; border:1px solid var(--line); border-radius:8px; padding:10px; background:#fff; }
    textarea { min-height:620px; resize:vertical; font:13px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace; }
    .status { display:inline-block; border-radius:999px; background:#e8eef8; padding:3px 9px; font-size:12px; }
    .muted { color:var(--muted); }
    .notice { border-left:4px solid var(--brand); background:#eff6ff; padding:10px 12px; margin-bottom:16px; }
    .evidence { border:1px solid var(--line); border-radius:8px; padding:12px; margin:10px 0; }
    .evidence.active { border-color:var(--brand); box-shadow:0 0 0 3px rgba(37,99,235,.14); }
    .evidence pre { white-space:pre-wrap; margin:8px 0 0; }
    .evidence-link { background:transparent; color:var(--brand); padding:0; border-radius:0; font-size:12px; text-decoration:underline; }
    .evidence-link + .evidence-link { margin-left:7px; }
    .evidence-link:disabled { color:#991b1b; cursor:not-allowed; }
    .review-section { border-top:1px solid var(--line); padding-top:14px; margin-top:14px; }
    .review-item { border:1px solid var(--line); border-radius:8px; padding:12px; margin:10px 0; }
    .review-fields { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:10px; }
    .review-field { border-left:3px solid #cbd5e1; background:#f8fafc; padding:9px 10px; min-width:0; }
    .review-field.changed { border-left-color:#d97706; background:#fffbeb; }
    .review-field input,.review-field select,.review-field textarea { margin-top:5px; }
    .review-field textarea { min-height:90px; }
    .review-value { font-weight:650; overflow-wrap:anywhere; white-space:pre-wrap; }
    .review-meta { color:var(--muted); font-size:12px; overflow-wrap:anywhere; }
    .changed-badge { color:#92400e; font-size:12px; font-weight:700; }
    details > summary { cursor:pointer; font-weight:650; margin-bottom:12px; }
    iframe { width:100%; min-height:680px; border:1px solid var(--line); border-radius:8px; background:white; }
    .errors { color:#991b1b; white-space:pre-wrap; }
    @media (max-width:900px) { .grid { grid-template-columns:1fr; } main { padding:14px; } }
  </style>
</head>
<body>
  <header><a href="/admin/documents">设备文档审核台</a><span class="muted">AI 提取 → 人工审核 → Profile 入库</span></header>
  <main>
    {% if message %}<div class="notice">操作完成：{{ message }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
