{% extends "admin/base.html" %}
{% block title %}登录 · 设备文档审核{% endblock %}
{% block content %}
<section class="card" style="max-width:420px;margin:48px auto">
  <h1>登录审核台</h1>
  <p class="muted">使用管理员账号登录，审核设备手册与 AI 提取结果。</p>
  {% if error %}<p class="errors" role="alert">{{ error }}</p>{% endif %}
  <form action="/admin/login" method="post">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next_url }}">
    <label for="admin-username">用户名</label>
    <input id="admin-username" type="text" name="username" value="{{ username }}" autocomplete="username" required autofocus style="margin:6px 0 16px">
    <label for="admin-password">密码</label>
    <input id="admin-password" type="password" name="password" autocomplete="current-password" required style="margin-top:6px">
    <button type="submit" style="width:100%;margin-top:20px">登录</button>
  </form>
</section>
{% endblock %}
